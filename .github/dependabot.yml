version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All action bumps bundled into a single PR.
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /application
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All package bumps bundled into a single PR.
      npm:
        patterns: ["*"]
