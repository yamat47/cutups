version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All action bumps bundled into a single PR.
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /application
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All package bumps bundled into a single PR.
      npm:
        patterns: ["*"]
    ignore:
      # Majors of typescript are bumped by hand, together with @astrojs/check.
      #
      # typescript must stay inside the peer range of @astrojs/check, which
      # `astro check` runs on; a major alone fails `npm ci`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node major in .node-version; bump it by hand with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
