name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: application

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      # github-toolkit is called at @main rather than pinned by SHA: it is the author's
      # own repository, it pins the upstream actions by SHA and Dependabot bumps them
      # there, and a change on its main reaches this workflow on the next run.
      - uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false
      - uses: yamat47/github-toolkit/actions/setup-node@main
        with:
          node-version-file: application/.node-version
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: npm run build
