name: deploy

on:
  push:
    branches: [main]
  # Redeploys without a commit, for example once Pages is turned on in infra-github.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: application

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here, unlike ci.yml: a cache entry is shared across branches, and
      # what this job builds is published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: application/.node-version
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: application/dist

  deploy:
    # A dispatch from another branch builds it but does not publish it.
    if: github.ref == 'refs/heads/main'
    needs: build
    # Only publishing is serialized, so a build from another branch never cancels a
    # queued deploy. A deploy runs to the end; the next one waits for it.
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # actions/deploy-pages
      id-token: write # actions/deploy-pages proves where the artifact came from with an OIDC token
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
